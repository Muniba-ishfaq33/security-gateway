<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enterprise Security Gateway</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 820px">
  <h3 class="mb-1">Enterprise Security Gateway</h3>
  <p class="text-muted">Hybrid Auth (Local + OAuth) · Refresh Rotation · RBAC · OWASP</p>

  <div class="alert alert-secondary" id="status">Not logged in</div>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="card"><div class="card-body">
        <h5>Register</h5>
        <input id="rName" class="form-control mb-2" placeholder="Name">
        <input id="rEmail" class="form-control mb-2" placeholder="Email">
        <input id="rPass" type="password" class="form-control mb-2" placeholder="Password (8+, letter+number)">
        <button id="btnRegister" class="btn btn-primary w-100">Register</button>
      </div></div>
    </div>
    <div class="col-md-6">
      <div class="card"><div class="card-body">
        <h5>Login</h5>
        <input id="lEmail" class="form-control mb-2" placeholder="Email">
        <input id="lPass" type="password" class="form-control mb-2" placeholder="Password">
        <button id="btnLogin" class="btn btn-success w-100 mb-2">Login</button>
        <a href="/api/v1/auth/google" class="btn btn-outline-danger w-100 mb-2">Login with Google</a>
        <a href="/api/v1/auth/github" class="btn btn-outline-dark w-100">Login with GitHub</a>
      </div></div>
    </div>
  </div>

  <div class="card mt-3"><div class="card-body">
    <h5>Protected Routes (RBAC demo)</h5>
    <button id="btnProfile" class="btn btn-outline-primary btn-sm">GET /employee/profile</button>
    <button id="btnPayroll" class="btn btn-outline-warning btn-sm">POST /payroll/approve</button>
    <button id="btnDelete" class="btn btn-outline-danger btn-sm">DELETE /users/999</button>
    <button id="btnRefresh" class="btn btn-outline-secondary btn-sm">POST /auth/refresh</button>
    <button id="btnLogout" class="btn btn-dark btn-sm">Logout</button>
  </div></div>

  <pre id="output" class="bg-dark text-light p-3 mt-3 rounded" style="min-height:140px">Response will show here...</pre>
</div>
<script src="app.js"></script>
</body>
</html>
